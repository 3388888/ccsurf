<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__MAP__ — spots</title>
<style>
  :root { --dim:#8b929c; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b0c0e; color:#d6d9de; overflow:hidden;
    font:13px/1.5 "Segoe UI", system-ui, sans-serif; }
  #c { display:block; width:100%; height:100%; cursor:grab; }
  #c.locked { cursor:none; }
  #hud { position:fixed; top:0; left:0; padding:12px 16px; pointer-events:none;
    text-shadow:0 1px 3px #000; }
  #hud b { color:#d2952b; }
  #panel { position:fixed; top:0; right:0; width:330px; height:100%; overflow-y:auto;
    background:rgba(18,20,24,.94); border-left:1px solid #2a2e35; padding:12px; }
  .sp { padding:7px 9px; border:1px solid #2a2e35; border-radius:4px; margin-bottom:6px;
    cursor:pointer; font-family:var(--mono); font-size:11.5px; }
  .sp:hover { border-color:#d2952b; }
  .sp.on { border-color:#d2952b; background:#231d12; }
  .k { font-weight:600; }
  .pixelsurf { color:#ffb64a; } .pixelwalk { color:#6f9fd8; } .surf { color:#7fb069; }
  .oob { color:#e0645c; }
  .muted { color:var(--dim); }
  #filters { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
  #filters button { background:#1e2126; border:1px solid #2a2e35; color:var(--dim);
    border-radius:14px; padding:3px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
  #filters button.on { border-color:#d2952b; color:#fff; }
  #help { position:fixed; bottom:0; left:0; padding:10px 16px; color:var(--dim); font-size:11.5px;
    text-shadow:0 1px 3px #000; pointer-events:none; }
  kbd { background:#22262c; border:1px solid #333; border-radius:3px; padding:0 4px;
    font-family:var(--mono); font-size:11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>__MAP__</b> <span class="muted">— <span id="tri"></span> tris</span><div id="pos" class="muted"></div></div>
<div id="panel"><div id="filters"></div><div id="list"></div></div>
<div id="help">
  <kbd>click</kbd> look &nbsp; <kbd>W A S D</kbd> move &nbsp; <kbd>Space</kbd>/<kbd>Ctrl</kbd> up/down &nbsp;
  <kbd>Shift</kbd> faster &nbsp; <kbd>Esc</kbd> release &nbsp; click a spot to fly to it
</div>

<script>__VIEW3D__</script>
<script>
"use strict";
const SPOTS = __SPOTS__;
const GEO_B64 = "__GEO__";
const cv = document.getElementById("c");

if (!View3D.load(cv, GEO_B64, SPOTS)) {
  document.body.innerHTML = "<p style='padding:20px'>WebGL unavailable.</p>";
} else {
  document.getElementById("tri").textContent = View3D.triCount.toLocaleString();
  View3D.onFrame = (cam) => {
    document.getElementById("pos").textContent =
      `setpos ${cam.pos[0].toFixed(0)} ${cam.pos[1].toFixed(0)} ${cam.pos[2].toFixed(0)}`;
  };
}

const KINDS = ["all", "oob", "pixelsurf", "pixelwalk", "surf"];
const count = (k) => k === "all" ? SPOTS.length
  : k === "oob" ? SPOTS.filter(s => !s.reachable).length
  : SPOTS.filter(s => s.kind === k).length;
const pred = (k) => k === "all" ? null : k === "oob" ? (s => !s.reachable) : (s => s.kind === k);

document.getElementById("filters").innerHTML = KINDS.map(k =>
  `<button data-k="${k}" class="${k === "all" ? "on" : ""}">${k} ${count(k)}</button>`).join("");

function renderList() {
  const list = document.getElementById("list");
  const vis = View3D.visible;
  list.innerHTML = vis.slice(0, 400).map((s, i) =>
    `<div class="sp" data-i="${i}">
       <span class="k ${s.reachable ? s.kind : "oob"}">${s.kind}${s.reachable ? "" : " · OOB"}</span>
       ${s.duckOnly ? '<span class="muted"> · crouch</span>' : ""}
       <div class="muted">${s.x.toFixed(0)} ${s.y.toFixed(0)} ${s.z.toFixed(0)} · ${s.width.toFixed(1)}u${
         s.heightAboveReachable != null ? ` · ${s.heightAboveReachable.toFixed(0)}u up` : ""}</div>
       ${s.entries && s.entries[0] ? `<div class="muted">${s.entries[0].label} @ eye ${s.entries[0].standEye.toFixed(2)}${
         s.entries[0].jump != null ? `, ${s.entries[0].crouch ? "crouch " : ""}${s.entries[0].jump.toFixed(2)}u` : ""}</div>` : ""}
     </div>`).join("") || '<div class="muted">nothing matches</div>';
  [...list.querySelectorAll(".sp")].forEach(el => el.addEventListener("click", () => {
    [...list.querySelectorAll(".sp")].forEach(x => x.classList.toggle("on", x === el));
    View3D.select(vis[+el.dataset.i]);
  }));
}
[...document.querySelectorAll("#filters button")].forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  View3D.setFilter(pred(b.dataset.k));
  renderList();
}));
renderList();
</script>
</body>
</html>
